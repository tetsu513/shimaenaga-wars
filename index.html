<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />

  <title>Shooting Ultimate</title>
  <style>
    :root { --ui: rgba(255,255,255,.9); --bg: #0b0b12; }
    body { margin:0; 
           background:var(--bg); 
           color:#eee; 
           font-family: system-ui, -apple-system, Segoe UI, sans-serif; 
           overflow:hidden; 
          
            /* iOS: selection/zoom/scroll kill */
          touch-action: none;
          user-select: none;
          -webkit-user-select: none;
          -webkit-touch-callout: none;
          }
    #wrap { position:relative; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
    canvas { background:#000; display:block; touch-action:none; }
    #wrap{
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
    -webkit-tap-highlight-color: transparent;
    }


/* Mobile controls */

.padR{
  position:absolute;
  bottom:18px;
  right:18px;
  display:flex;
  gap:12px;
  z-index:10;
}

    .btn {
      width:72px; height:72px; border-radius:20px;
      background:rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.20);
      color:var(--ui); font-weight:700; font-size:18px;
      display:flex; align-items:center; justify-content:center;


    /* iOS: prevent highlight/selection/gesture */
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(6px);
      -webkit-user-drag: none;      /* 画像/要素のドラッグ禁止 */

    }
    .btn:active { transform: translateY(1px); background:rgba(255,255,255,.16); }

    /* Small label top */
    .hint {
      position:absolute; top:10px; left:12px; right:12px;
      font-size:12px; opacity:.85; display:flex; justify-content:space-between; gap:12px;
      z-index:10;
    }
    .hint .k { opacity:.95; }
    .hide { display:none; }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="hint">
      <div class="k">←→ / Space / Enter　（スマホ：左/右/SHOT）</div>
      <div class="k">F12でConsole</div>
    </div>

    <canvas id="game"></canvas>

  </div>

  <script src="main.js"></script>
</body>
</html>
